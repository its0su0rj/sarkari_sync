name: Telegram bot

on:
  schedule:
    - cron: "17 * * * *"           # every hour: answer new messages
    - cron: "47 2 * * *"           # every day at about 08:17 IST: send alerts
  workflow_dispatch:
    inputs:
      alerts:
        description: "Also send alerts now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: exammatch-state
  cancel-in-progress: false

jobs:
  bot:
    if: vars.TELEGRAM_BOT_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4 lxml cryptography
      - name: Website address
        run: echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - name: Restore data
        run: |
          python state.py pull jobsdb sarkari.db
          python state.py pull state bot_state.json
      - name: Answer messages
        run: python bot.py poll
      - name: Send alerts
        if: github.event.schedule == '47 2 * * *' || inputs.alerts
        run: python bot.py alerts
      - name: Save subscribers
        if: always()
        run: python state.py push state bot_state.json
